name: Release

# Push a tag matching the CLI version (e.g. v0.5.0) to publish binaries to a
# GitHub release and the npm packages. npm trusts this workflow (trusted
# publishing, configured on each package with `npm trust github`), so there is
# no npm token: the job's OIDC identity is the credential.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Check the tag matches the CLI version
        run: test "v$(jq -r .version packages/cli/package.json)" = "$GITHUB_REF_NAME"

      - run: bun run build:all

      - name: Archive binaries
        run: |
          mkdir -p release
          for dir in dist/shelf-*/; do
            id=$(basename "$dir")
            if [ -f "$dir/shelf.exe" ]; then
              (cd "$dir" && zip -q "../../release/$id.zip" shelf.exe)
            else
              tar -C "$dir" -czf "release/$id.tar.gz" shelf
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skipped when re-running a release whose GitHub release already exists.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@11
          bun run pack:npm
          # Platform packages first, so the launcher's optionalDependencies resolve.
          # Versions already on npm are skipped, so a failed run can be re-run.
          for dir in dist/npm/shelf-*/ dist/npm/shelf/; do
            spec="$(jq -r '.name + "@" + .version' "$dir/package.json")"
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; continue; fi
            npm publish "$dir" --access public --provenance
          done
